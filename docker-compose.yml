# Production stack for a single VPS.
#
#   docker compose --env-file .env.production up -d
#
# Nothing except nginx publishes a host port — the app services are reachable
# only on the internal network, so the reverse proxy is the single ingress and
# there is no way to bypass TLS by hitting :3000 directly.

name: zuptech

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # Consumed by the init script below.
      ZUPTECH_DB_PASSWORD: ${ZUPTECH_DB_PASSWORD:?set ZUPTECH_DB_PASSWORD}
      MEDIA_DB_PASSWORD: ${MEDIA_DB_PASSWORD:?set MEDIA_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only executed when pgdata is empty — adding a database later means
      # running the SQL by hand, not editing this file and restarting.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    image: ${REGISTRY:-ghcr.io/OWNER/REPO}/storage:${TAG:-latest}
    build:
      context: .
      dockerfile: storage/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3100
      HOST: 0.0.0.0
      API_KEY: ${STORAGE_API_KEY:?set STORAGE_API_KEY}
      DATABASE_URL: postgres://media_storage:${MEDIA_DB_PASSWORD}@db:5432/media_storage
      STORAGE_ROOT: /data
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-524288000}
    volumes:
      # The uploaded originals live here. This volume plus a pg_dump is the
      # complete backup set — losing either one loses the media library.
      - media_data:/data
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: ${REGISTRY:-ghcr.io/OWNER/REPO}/backend:${TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://zuptech:${ZUPTECH_DB_PASSWORD}@db:5432/zuptech
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      # In-network for server-side uploads…
      STORAGE_URL: http://storage:3100
      # …but the URLs the backend PERSISTS (Product.photos, Service.image, …)
      # are later rendered in a browser, which cannot resolve `storage`. So the
      # public origin has to be passed in too — the same one the frontend gets.
      # Omit this and every uploaded image is stored permanently broken.
      STORAGE_PUBLIC_URL: ${NEXT_PUBLIC_STORAGE_URL:?set NEXT_PUBLIC_STORAGE_URL}
      STORAGE_API_KEY: ${STORAGE_API_KEY}
      # SMTP delivers password-reset OTPs. Unset SMTP_HOST logs the code to
      # the container log instead of sending — fine for staging, not for prod.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  frontend:
    image: ${REGISTRY:-ghcr.io/OWNER/REPO}/frontend:${TAG:-latest}
    build:
      context: .
      dockerfile: fronend/Dockerfile
      args:
        # …but the BROWSER fetches media directly, so this one must be the
        # public https origin, and it is baked in at build time.
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:?set NEXT_PUBLIC_STORAGE_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Templates, not conf.d: the image renders these through envsubst at
      # startup and writes the result into conf.d itself.
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?set MEDIA_DOMAIN}
      # Restrict envsubst to our three placeholders. Unfiltered, it would also
      # expand anything in the container's environment that collides with an
      # nginx variable name — $$host and friends would render empty and the
      # proxy would start subtly broken rather than failing loudly.
      NGINX_ENVSUBST_FILTER: "_DOMAIN$$"
    depends_on:
      - frontend
      - backend
      - storage
    # Renders the templates, then reloads every 12h to pick up renewed certs.
    #
    # The envsubst call is explicit because the image's entrypoint only runs
    # /docker-entrypoint.d/* when its first argument is literally `nginx` — and
    # this command starts with /bin/sh, for the reload loop. Without the call
    # the templates are silently never rendered and nginx serves its default
    # welcome page instead of the site. `sh -e` makes a rendering failure kill
    # the container (visible, restart-looping) rather than degrade to that page.
    command: >
      /bin/sh -ec "/docker-entrypoint.d/20-envsubst-on-templates.sh; while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  pgdata:
  media_data:
  certbot_conf:
  certbot_www:
