name: CI

on:
  # Deploy calls this workflow as its gate (`uses: ./.github/workflows/ci.yml`),
  # which only works if the called workflow declares workflow_call — without it
  # the Deploy run fails to start at all, before any step executes.
  workflow_call:
  pull_request:

# Deliberately NOT `push: [main]`: deploy.yml runs on that push and calls this
# workflow itself, so a push trigger here would run the whole suite twice for
# the same commit. PRs still get their own run.

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # The backend imports from src/generated, which is gitignored — without
      # this every backend typecheck fails on missing modules.
      - name: Generate Prisma client
        working-directory: backend
        run: bunx --bun prisma generate

      - name: Typecheck (backend)
        working-directory: backend
        run: bunx tsc --noEmit

      - name: Typecheck (frontend)
        working-directory: fronend
        run: bunx tsc --noEmit

      - name: Lint (frontend)
        working-directory: fronend
        run: bun run lint

      - name: Test (backend)
        working-directory: backend
        run: bun test

      # The frontend has had unit tests since before this job existed and none
      # of them had ever run here — video URL parsing, the money the product
      # card prints, the admin's error text. They only guard anything if CI
      # executes them.
      - name: Test (frontend)
        working-directory: fronend
        run: bun test

  # Proves the images build before main is allowed to deploy. No push here —
  # this is a compile check, not a release.
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fronend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://example.invalid
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=demo
