name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys touch the VPS at once; queue instead of cancelling, so
# a half-applied migration can't be interrupted.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  # Gate: main only deploys if the same commit passes CI.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # Tag with the SHA as well as latest, so a rollback is a tag change
          # rather than a rebuild.
          tags: |
            ${{ env.REGISTRY }}/backend:latest
            ${{ env.REGISTRY }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Storage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: storage/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/storage:latest
            ${{ env.REGISTRY }}/storage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fronend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:latest
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Public origins are inlined into the client bundle here. They are
          # repository *variables*, not secrets — they end up in public JS.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_STORAGE_URL=${{ vars.NEXT_PUBLIC_STORAGE_URL }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll out on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/zuptech

            # Compose files and nginx config are read from the checkout, so the
            # VPS needs the repo even though it runs prebuilt images.
            git fetch --all
            git reset --hard origin/main

            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export TAG=${{ github.sha }}
            docker compose --env-file .env.production pull

            # Migrations BEFORE the new code starts serving. --rm so the
            # one-shot container never lingers; db:deploy only applies
            # committed migrations and never prompts.
            docker compose --env-file .env.production run --rm backend \
              bunx --bun prisma migrate deploy
            docker compose --env-file .env.production run --rm storage \
              bun run migrate

            docker compose --env-file .env.production up -d --remove-orphans

            # Reclaim old image layers; without this the VPS disk fills up
            # after a few dozen deploys.
            docker image prune -f

      - name: Smoke check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/zuptech
            for i in $(seq 1 30); do
              if docker compose --env-file .env.production exec -T backend \
                   bun -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "backend healthy"; exit 0
              fi
              sleep 4
            done
            echo "backend did not become healthy — dumping logs"
            docker compose --env-file .env.production logs --tail=80 backend
            exit 1
