name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys touch the VPS at once; queue instead of cancelling, so
# a half-applied migration can't be interrupted.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# NOTE: no workflow-level REGISTRY here. `github.repository` keeps the owner's
# original casing (MoZahidUl249), and a Docker tag must be lowercase — every
# publish so far died on `invalid tag ...: repository name must be lowercase`.
# The publish job lowercases it into $REGISTRY as its first step instead.

jobs:
  # Gate: main only deploys if the same commit passes CI.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # ${VAR,,} is bash lowercase expansion — the whole owner/repo pair, since
      # either half may carry uppercase.
      - name: Resolve registry (must be lowercase)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          # Tag with the SHA as well as latest, so a rollback is a tag change
          # rather than a rebuild.
          tags: |
            ${{ env.REGISTRY }}/backend:latest
            ${{ env.REGISTRY }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fronend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:latest
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Public origins are inlined into the client bundle here. They are
          # repository *variables*, not secrets — they end up in public JS.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}

  deploy:
    needs: publish
    # PUBLISHING IS AUTOMATIC; THE ROLLOUT IS NOT.
    #
    # A push to main runs CI and pushes SHA-tagged images to GHCR, then stops.
    # Putting them on the VPS is a deliberate act: Actions -> Deploy -> Run
    # workflow. That is the "publish, then push live" split — it exists so a
    # change can be tested against the live database from a workstation
    # (scripts/live-stack.sh) in between the two.
    #
    # An `if:` rather than GitHub's environment required-reviewers, which would
    # give a nicer approval prompt but needs a paid plan on a private repo.
    # This works on any plan. If the repo is ever on Team/Pro, adding reviewers
    # to the `production` environment below stacks on top of this fine.
    #
    # Note what a dispatch actually deploys: the VPS step does
    # `git reset --hard origin/main`, so the checkout is always origin/main's
    # tip, while TAG below is the SHA of whatever ref you dispatched. Dispatch
    # from main and they agree. Dispatch from another branch and the box runs
    # main's compose file against that branch's images — don't.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    # The VPS logs in to GHCR with this job's GITHUB_TOKEN to pull the images
    # published above. On a private repo those packages are private too, so
    # without `packages: read` the login succeeds and the pull 403s.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Roll out on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # NOTE: no `script_stop`. appleboy/ssh-action@v1 dropped that input,
          # and an unrecognised input is a hard failure — the step dies on
          # validation before it ever opens a connection. That is what broke
          # every deploy between 2026-08-09 and 2026-08-10: five consecutive
          # runs failed with "Unexpected input(s) 'script_stop'" while the
          # images published fine, so the box silently stayed on old code.
          # `set -euo pipefail` below already does what the flag did.
          script: |
            set -euo pipefail
            # Wherever the checkout actually is. It was hardcoded to
            # /opt/zuptech, which does not exist on the box — the live stack
            # runs out of ~/zup/zuptech, so every rollout died on its first
            # line while CI reported the images published.
            cd "${APP_DIR:-$HOME/zup/zuptech}"

            # Compose files and nginx config are read from the checkout, so the
            # VPS needs the repo even though it runs prebuilt images.
            git fetch --all
            git reset --hard origin/main

            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # REGISTRY is exported here rather than read from .env.production,
            # which still carries the placeholder the images were built under
            # by hand. A shell variable wins over --env-file in compose's
            # interpolation, so this points the pull at the packages the
            # publish job just pushed without editing anything on the box.
            export REGISTRY=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Pull, migrate BOTH databases, start, verify, prune. Deliberately
            # the same script an operator runs by hand, so a fix to the rollout
            # sequence can never land in one path and be missed by the other.
            export TAG=${{ github.sha }}
            bash scripts/deploy.sh --pull

      # scripts/deploy.sh already polls /health and fails the job if the backend
      # never comes up, so this step no longer repeats that. It checks the thing
      # /health cannot: /health only proves the DB adapter connected, which an
      # unmigrated or unseeded database passes just fine. /api/site-config is
      # the query the storefront actually depends on — it reads the SiteConfig
      # row with findUniqueOrThrow, so it 500s on exactly the states that make
      # every page 500 while the container still reports itself healthy.
      - name: Smoke check the storefront's data path
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # See the note on the rollout step above — `script_stop` is not a
          # valid input any more and fails the step outright.
          script: |
            set -euo pipefail
            cd "${APP_DIR:-$HOME/zup/zuptech}"
            code=$(docker compose --env-file .env.production exec -T backend \
              bun -e "fetch('http://127.0.0.1:3000/api/site-config').then(r=>console.log(r.status)).catch(()=>console.log('000'))")
            echo "GET /api/site-config -> $code"
            if [ "$code" != "200" ]; then
              echo "storefront data path is broken — dumping logs"
              docker compose --env-file .env.production logs --tail=80 backend
              exit 1
            fi
