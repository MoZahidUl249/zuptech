# Upstreams are compose service names on the internal network.
upstream storefront { server frontend:3001; }
upstream api        { server backend:3000; }
upstream media      { server storage:3100; }

# ACME + HTTP->HTTPS. Keep this server block on :80 permanently; certbot
# renews through it.
server {
    listen 80;
    server_name zuptech.com.bd www.zuptech.com.bd api.zuptech.com.bd media.zuptech.com.bd;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- storefront ----------
server {
    listen 443 ssl;
    http2 on;
    server_name zuptech.com.bd www.zuptech.com.bd;

    ssl_certificate     /etc/letsencrypt/live/zuptech.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zuptech.com.bd/privkey.pem;

    location / {
        proxy_pass http://storefront;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# ---------- API ----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.zuptech.com.bd;

    ssl_certificate     /etc/letsencrypt/live/zuptech.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zuptech.com.bd/privkey.pem;

    # Admin photo/video uploads proxy through the API to the storage service.
    client_max_body_size 320m;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- media ----------
server {
    listen 443 ssl;
    http2 on;
    server_name media.zuptech.com.bd;

    ssl_certificate     /etc/letsencrypt/live/zuptech.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zuptech.com.bd/privkey.pem;

    client_max_body_size 520m;

    location /files/ {
        proxy_pass http://media;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Video is served with HTTP Range. Buffering makes nginx pull the whole
        # response before forwarding, which silently breaks seeking —
        # see storage/README.md.
        proxy_buffering off;
    }

    location / {
        proxy_pass http://media;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
