services:
  app:
    # Root context — the Dockerfile now consumes the workspace lockfile.
    build:
      context: ..
      dockerfile: storage/Dockerfile
    ports:
      - "3100:3100"
    environment:
      PORT: 3100
      HOST: 0.0.0.0
      API_KEY: ${API_KEY:-dev-only-change-me-please-1234567890}
      DATABASE_URL: postgres://media_storage:media_storage@db:5432/media_storage
      STORAGE_ROOT: /data
    volumes:
      - media_data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: media_storage
      POSTGRES_PASSWORD: media_storage
      POSTGRES_DB: media_storage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_storage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  media_data:
  pgdata:
